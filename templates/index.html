<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
   <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=1.1">
    <title>{{ about.name }} | Systems Developer</title>
</head>
<body>
    <header>
        <div class="navbar">
            <img src="{{ url_for('static', filename='images/' + about.logo) }}" alt="Logo" class="site-logo">
            <h1>{{ about.name }}</h1>
            <nav>
                <a href="#about">About</a>
                <a href="#portfolio">Solutions</a>
                <a href="#contact" style="color: var(--gold);">Get Consultation</a>
            </nav>
        </div>
    </header>

    <main>
       <section id="about">
            <img src="{{ url_for('static', filename='images/' + about.profile_pic) }}" alt="Profile" class="profile-pic">
        <h2>About Me</h2>
        <div class="about-text">
            {% for paragraph in about.bio %}
            <p>{{ paragraph }}</p>
            {% endfor %}
        </div>
        </section>

        <section id="portfolio">
            <h2>Solutions</h2>
            {% for project in projects %}
            <div class="project-content">
                <h3>{{ project.title }}</h3>
                <p>{{ project.description }}</p>
                <a href="{{ project.github_url }}">View Technical Demo →</a>
            </div>
            {% endfor %}
        </section>

        <section id="contact">
            <h2>Contact</h2>
            <form action="{{ url_for('contact') }}" method="POST">
                <input type="text" name="name" placeholder="Name" required>
                <input type="email" name="email" placeholder="Email" required>
                <textarea name="message" placeholder="How can I help you?"></textarea>
                <button type="submit">Send Message</button>
            </form>
        </section>
    </main>
</body>
</html>
